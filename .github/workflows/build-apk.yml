name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o ai_youtube_factory_phone_build_fixed.zip -d project

          sed -i "s/applicationId 'com.aifactory.youtube'/applicationId 'com.modyfarah.aifactory'/" project/android_app/app/build.gradle

          sed -i "s/versionCode 1/versionCode 2/" project/android_app/app/build.gradle

      - name: Build release APK
        run: |
          cd project/android_app
          gradle assembleRelease

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find project/android_app -type f -name "*.apk" -print

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          APK=$(find project/android_app -type f -name "*.apk" | head -1)

          echo "Found APK: $APK"

          keytool -genkeypair \
            -keystore release.keystore \
            -alias ai-youtube \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=AI YouTube Factory,O=Cairo,C=EG"

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-release.apk \
            "$APK"

          "$BUILD_TOOLS/apksigner" verify --verbose app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-YouTube-Factory-Release
          path: app-release.apk
